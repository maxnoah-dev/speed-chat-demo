user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Rate limiting zones
    # Zone 1: General requests - 100 requests per second per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    
    # Zone 2: POST requests - 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=post_limit:10m rate=10r/s;
    
    # Zone 3: API endpoints - 50 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Upstream backend server
    upstream backend {
        least_conn;
        server be-nodejs:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS for production
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # Main server block
    server {
        listen 80;
        server_name _;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # Block suspicious user agents
        if ($http_user_agent ~* (bot|crawler|spider|scraper|curl|wget)) {
            return 403;
        }

        # Block requests with suspicious patterns
        if ($request_uri ~* (\.php|\.asp|\.jsp|wp-admin|\.env|config\.php)) {
            return 403;
        }

        # Block if request method is not allowed
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
            return 405;
        }

        # Block empty User-Agent
        if ($http_user_agent = "") {
            return 403;
        }

        # Block only excessive slashes (3+ consecutive slashes)
        if ($request_uri ~* "/{3,}") {
            return 403;
        }

        # POST requests - stricter rate limiting
        location ~ ^/api/posts$ {
            limit_req zone=post_limit burst=2 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 24 4k;
            proxy_busy_buffers_size 8k;
        }

        # GET API requests - moderate rate limiting
        location ~ ^/api/(users|posts)$ {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 24 4k;
        }

        # Health check endpoint - generous rate limiting
        location /api/health {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://backend;
            access_log off;
        }

        # Default location
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
