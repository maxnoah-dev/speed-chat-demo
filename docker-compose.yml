services:
  nginx:
    container_name: nginx-proxy
    image: nginx:alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      fe-react:
        condition: service_healthy
      be-nodejs:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  fe-react:
    container_name: fe-react
    build:
      context: ./fe
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost}
    environment:
      - VIRTUAL_HOST=social-demo.maxnoah.io.vn
      - VIRTUAL_PORT=80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  be-nodejs:
    container_name: be-nodejs
    build: ./be
    env_file:
      - ./be/.env
    environment:
      - PORT=${BE_PORT:-3002}
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-root}
      - DB_NAME=${DB_NAME:-social_demo}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://165.22.99.117}
    restart: unless-stopped
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/api/health', (r)=>{ r.resume(); process.exit(r.statusCode===200?0:1); }).on('error', ()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - app-network
    expose:
      - 3002

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    env_file:
      - .env.mysql
    ports:
      - "3306:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge