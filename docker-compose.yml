services:
  nginx:
    container_name: nginx-proxy
    image: nginx:alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - be-nodejs
      - fe-react
    restart: unless-stopped
    networks:
      - app-network

  fe-react:
    container_name: fe-react
    build:
      context: ./fe
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-}
    environment:
      - VIRTUAL_HOST=social-demo.maxnoah.io.vn
      - VIRTUAL_PORT=80
    restart: unless-stopped
    networks:
      - app-network

  be-nodejs:
    container_name: be-nodejs
    build: ./be
    env_file:
      - ./be/.env
    environment:
      - PORT=${BE_PORT:-3002}
      - DB_USER=${DB_USER:-root}
      - DB_NAME=${DB_NAME:-social_demo}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://165.22.99.117}
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - 3002

networks:
  app-network:
    driver: bridge