name: Deploy
on:
  push:
    branches: [fe-nginx-demo]
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd social-full-demo
            git pull origin fe-nginx-demo
            docker-compose down
            docker-compose build
            docker-compose up -d
            docker image prune -f