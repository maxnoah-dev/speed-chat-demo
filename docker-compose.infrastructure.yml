services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    env_file:
      - .env.mysql
    ports:
      - 3306:3306
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  prisma-migrate:
    build:
      context: ./be
      dockerfile: Dockerfile.migrate
    container_name: prisma-migrate
    env_file:
      - .env.mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_NAME: speed_chat
    command: sh -c "export DB_PASSWORD=$$MYSQL_ROOT_PASSWORD && npx prisma migrate deploy"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
