# Override cho development: expose port FE/BE để truy cập trực tiếp (không qua nginx).
# Chạy: docker compose --env-file .env.development -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  fe-react:
    build:
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3002}
    ports:
      - "3003:80"

  be-nodejs:
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3003}
    ports:
      - "3002:3002"
