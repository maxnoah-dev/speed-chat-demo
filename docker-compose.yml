services:
  nginx:
    container_name: nginx-proxy
    image: nginx:alpine
    ports:
      - 3002:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - be-nodejs
    restart: unless-stopped
    networks:
      - app-network

  fe-react:
    container_name: fe-react
    ports:
      - 3003:80
    build:
      context: ./fe
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://188.166.234.37:3002}
    restart: unless-stopped
    networks:
      - app-network

  be-nodejs:
    container_name: be-nodejs
    build: ./be
    env_file:
      - ./be/.env
    environment:
      - PORT=${BE_PORT:-3002}
      - DB_USER=${DB_USER:-root}
      - DB_NAME=${DB_NAME:-social_demo}
      - CORS_ORIGIN=${CORS_ORIGIN}
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - 3002

networks:
  app-network:
    driver: bridge